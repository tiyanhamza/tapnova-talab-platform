<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapNova · حساب المقهى</title><style>body{font-family:system-ui;background:#f3f5f6;margin:0;color:#17212b}.wrap{max-width:520px;margin:30px auto;padding:16px}.card{background:white;border-radius:16px;padding:20px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:9px;width:100%;margin:7px 0}input{border:1px solid #ccd3d8}button{background:#101820;color:white;border:0;font-weight:bold}.gold{background:#d9a441;color:#101820}.muted{color:#667}.hide{display:none}</style><main class="wrap"><h2>TapNova Talab · فضاء صاحب المقهى</h2><section class="card" id="login"><label>رابط المقهى (slug)</label><input id="slug" placeholder="hamza-cafe"><label>الكود الخاص بالمقهى</label><input id="code" type="password"><button id="enter" class="gold">دخول</button><p id="msg" class="muted"></p></section><section class="card hide" id="home"><h3 id="name"></h3><p>من هنا تقدر تصاوب رابط تفعيل للنادل. الرابط صالح لمدة 24 ساعة ويستعمل مرة واحدة.</p><button id="invite">إنشاء رابط تفعيل نادل</button><p id="link"></p><button id="logout">تسجيل الخروج</button></section></main><script>const $=x=>document.getElementById(x);let token=localStorage.getItem("tn_owner_token");async function call(url,method,body){const r=await fetch(url,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||"خطأ");return j}async function show(){if(!token)return;try{const x=await call("/api/owner");$("name").textContent=x.restaurant.name;$("login").classList.add("hide");$("home").classList.remove("hide")}catch{$("login").classList.remove("hide");$("home").classList.add("hide");token=null;localStorage.removeItem("tn_owner_token")}}$("enter").onclick=async()=>{try{const x=await call("/api/owner","POST",{action:"login",slug:$("slug").value.trim(),code:$("code").value});token=x.token;localStorage.setItem("tn_owner_token",token);await show()}catch(e){$("msg").textContent=e.message}};$("invite").onclick=async()=>{try{const x=await call("/api/owner","POST",{action:"waiter-invite"});const url=location.origin+x.url;$("link").innerHTML='<a href="'+url+'">'+url+'</a><br>صيفط هاد الرابط للنادل.'}catch(e){$("link").textContent=e.message}};$("logout").onclick=()=>{localStorage.removeItem("tn_owner_token");location.reload()};show();</script></html>
