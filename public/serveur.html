<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820"><title>TapNova · Espace serveur</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#17212b;font-family:system-ui,Arial}.head{background:#101820;color:#fff;padding:20px}.wrap{max-width:850px;margin:auto;padding:16px}.brand{color:#d9a441;font-weight:900;letter-spacing:.14em}.panel,.ticket{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 16px #00000008}input{width:100%;padding:13px;border:1px solid #d9dfe3;border-radius:10px;margin:7px 0 12px;font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:#101820;color:#fff;font:inherit;font-weight:700;cursor:pointer}button.gold{background:#d9a441;color:#101820}button:disabled{opacity:.5}.hidden{display:none}.muted{color:#71808a;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap}.tabs button.active{background:#d9a441;color:#101820}.ticket{border-right:5px solid #d9a441}.ticket h3{margin:0 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{display:inline-block;background:#f1f3f5;padding:4px 9px;border-radius:20px;font-size:12px}.empty{text-align:center;padding:28px;color:#71808a}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
</style></head>
<body>
<header class="head"><div class="wrap"><div class="brand">TAPNOVA TALAB</div><h1 style="margin:8px 0">واجهة النادل</h1><div class="muted" style="color:#c2cbd1">الطلبات ونداءات الطاولات في مكان واحد</div></div></header>
<main class="wrap">
<section class="panel" id="login"><h2>دخول النادل</h2><label>اسم المطعم (slug)</label><input id="slug" value="hamza-cafe" placeholder="hamza-cafe"><label>كود الإدارة</label><input id="key" type="password" placeholder="كود الإدارة"><button class="gold" id="connect">دخول وتشغيل التنبيهات</button><p class="muted" id="msg">استعمل كود الإدارة الحالي. خَلّي هاد الصفحة مفتوحة أثناء الخدمة.</p></section>
<section id="app" class="hidden">
<div class="panel topline"><div><b id="restaurant">المطعم</b><div class="muted" id="updated">في انتظار التحديث…</div></div><button id="sound" class="gold">تفعيل الصوت</button></div>
<nav class="tabs"><button class="active" data-tab="requests">نداءات الطاولات</button><button data-tab="orders">طلبات المنتجات</button></nav>
<section id="requests"></section><section id="orders" class="hidden"></section>
</section></main>
<script>
const $=id=>document.getElementById(id);let key="",slug="",firstLoad=true,seenRequests=new Set(),seenOrders=new Set(),timer=null,audio=null;
async function api(method="GET",body){const url="/api/waiter"+(method==="GET"?"?slug="+encodeURIComponent(slug):"");const r=await fetch(url,{method,headers:{"Content-Type":"application/json","x-admin-key":key},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||"API error");return j}
function beep(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.frequency.value=880;gain.gain.value=.12;osc.start();osc.stop(audio.currentTime+.22);if(navigator.vibrate)navigator.vibrate([180,80,180]);}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function time(s){return new Date(s).toLocaleTimeString("fr-MA",{hour:"2-digit",minute:"2-digit"})}
function render(d){
 $("restaurant").textContent=d.restaurant.name;
 const req=d.requests||[],orders=d.orders||[];
 if(!firstLoad&&(req.some(x=>!seenRequests.has(String(x.id)))||orders.some(x=>!seenOrders.has(String(x.id)))))beep();
 req.forEach(x=>seenRequests.add(String(x.id)));orders.forEach(x=>seenOrders.add(String(x.id)));
 $("requests").innerHTML=req.map(x=>'<article class="ticket"><div class="topline"><h3>🔔 '+esc(x.request_label)+'</h3><span class="pill">'+esc(x.status)+'</span></div><b>الطابلة '+esc(x.table_number)+'</b><div class="muted">'+time(x.created_at)+'</div><div class="actions">'+(x.status==="pending"?'<button class="gold" data-ack="'+x.id+'">غادي نتكلف به</button>':'')+'<button data-rdone="'+x.id+'">تم التنفيذ</button></div></article>').join("")||'<div class="panel empty">ما كاين حتى نداء جديد.</div>';
 $("orders").innerHTML=orders.map(x=>'<article class="ticket"><div class="topline"><h3>🛎️ طلبية #'+esc(x.id)+'</h3><span class="pill">'+esc(x.status)+'</span></div><b>الطابلة '+esc(x.table_number||"—")+'</b><p>'+((x.items||[]).map(i=>esc(i.name)+" × "+esc(i.quantity)).join("، "))+'</p><b>'+esc(x.total)+' MAD</b><div class="muted">'+time(x.created_at)+'</div><div class="actions">'+(x.status==="new"?'<button class="gold" data-prep="'+x.id+'">بدأ التحضير</button>':'')+(x.status==="preparing"?'<button class="gold" data-ready="'+x.id+'">وجدات</button>':'')+(x.status==="ready"?'<button data-delivered="'+x.id+'">تسلمات</button>':'')+'</div></article>').join("")||'<div class="panel empty">ما كايناش طلبيات جديدة.</div>';
 document.querySelectorAll("[data-ack]").forEach(b=>b.onclick=()=>change("request",b.dataset.ack,"acknowledged"));
 document.querySelectorAll("[data-rdone]").forEach(b=>b.onclick=()=>change("request",b.dataset.rdone,"completed"));
 document.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>change("order",b.dataset.prep,"preparing"));
 document.querySelectorAll("[data-ready]").forEach(b=>b.onclick=()=>change("order",b.dataset.ready,"ready"));
 document.querySelectorAll("[data-delivered]").forEach(b=>b.onclick=()=>change("order",b.dataset.delivered,"delivered"));
 $("updated").textContent="آخر تحديث: "+new Date().toLocaleTimeString("fr-MA");
 firstLoad=false;
}
async function refresh(){try{render(await api())}catch(e){$("updated").textContent="تعذر التحديث: "+e.message}}
async function change(kind,id,status){try{await api("PATCH",{slug,kind,id,status});await refresh()}catch(e){alert(e.message)}}
$("connect").onclick=async()=>{key=$("key").value;slug=$("slug").value.trim();if(!key||!slug){$("msg").textContent="دخل الكود واسم المطعم";return}try{const d=await api();$("login").classList.add("hidden");$("app").classList.remove("hidden");render(d);if(timer)clearInterval(timer);timer=setInterval(refresh,4000);if(audio&&audio.state==="suspended")await audio.resume()}catch(e){$("msg").textContent=e.message}};
$("sound").onclick=async()=>{try{audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();beep();$("sound").textContent="الصوت مفعّل"}catch(e){$("sound").textContent="تعذر تفعيل الصوت"}};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["requests","orders"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab))});
</script></body></html>
