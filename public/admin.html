<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapNova Talab · Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#17212b;font-family:system-ui,Arial}.head{background:#101820;color:white;padding:20px}.wrap{max-width:1000px;margin:auto;padding:18px}.brand{color:#d9a441;font-weight:900;letter-spacing:.15em}.panel{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 16px #00000008}input,select,textarea{padding:12px;border:1px solid #d9dfe3;border-radius:9px;width:100%;margin:5px 0 12px;font:inherit}button{padding:11px 15px;border:0;border-radius:10px;background:#101820;color:white;font-weight:700;cursor:pointer}.gold{background:#d9a441;color:#101820}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee;align-items:center}.muted{color:#71808a;font-size:13px}.hidden{display:none}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap}.tabs button.active{background:#d9a441;color:#101820}h2{margin-top:0}
</style></head><body><header class="head"><div class="wrap"><div class="brand">TAPNOVA TALAB</div><h1>Restaurant dashboard</h1><div class="muted" style="color:#c2cbd1">Gestion des menus, commandes et tables</div></div></header><main class="wrap"><section class="panel" id="login"><h2>Accès administrateur</h2><label>Code administrateur</label><input id="key" type="password" placeholder="ADMIN_KEY"><button class="gold" id="connect">Se connecter</button><p class="muted" id="loginmsg">Le code est défini dans les variables d'environnement Vercel.</p></section><div id="app" class="hidden"><section class="panel"><div class="grid"><div><label>Restaurant</label><input id="rname" placeholder="Nom du restaurant"></div><div><label>Identifiant public (slug)</label><input id="slug" placeholder="mon-restaurant"></div><div><label>Téléphone</label><input id="phone" placeholder="06..."></div><div><label>Adresse</label><input id="address" placeholder="Casablanca"></div></div><button class="gold" id="saveR">Créer le restaurant</button><span class="muted" id="rmsg"></span></section><nav class="tabs"><button class="active" data-tab="orders">Commandes</button><button data-tab="products">Produits</button><button data-tab="categories">Catégories</button><button data-tab="tables">Tables & QR</button><button data-tab="requests">Service</button></nav><section class="panel" id="orders"></section><section class="panel hidden" id="products"><h2>Produits</h2><div class="grid"><input id="pAr" placeholder="Nom arabe"><input id="pFr" placeholder="Nom français"><input id="price" type="number" min="0" step=".5" placeholder="Prix MAD"><input id="image" placeholder="URL image (facultatif)"><select id="cat"></select></div><button class="gold" id="addProduct">Ajouter le produit</button><div id="plist"></div></section><section class="panel hidden" id="categories"><h2>Catégories</h2><div class="grid"><input id="cAr" placeholder="Nom arabe"><input id="cFr" placeholder="Nom français"></div><button class="gold" id="addCat">Ajouter catégorie</button><div id="clist"></div></section><section class="panel hidden" id="tables"><h2>Tables et QR</h2><input id="tableNo" placeholder="Numéro de table"><button class="gold" id="addTable">Créer une table</button><div id="tlist"></div></section><section class="panel hidden" id="requests"><h2>Demandes de service</h2><div id="slist"></div></section></div></main><script>
const $=id=>document.getElementById(id);let key="",data=null,slug="";
async function api(path,method="GET",body){const r=await fetch(path,{method,headers:{"Content-Type":"application/json","x-admin-key":key},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||"Erreur API");return j}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){data=await api("/api/admin"+(slug?"?slug="+encodeURIComponent(slug):""));if(data.restaurant){slug=data.restaurant.slug;$("rname").value=data.restaurant.name;$("slug").value=slug;$("phone").value=data.restaurant.phone||"";$("address").value=data.restaurant.address||""}draw()}
function draw(){const d=data||{};$("orders").innerHTML="<h2>Commandes récentes</h2>"+(d.orders||[]).map(o=>'<div class="row"><div><b>#'+esc(o.id)+'</b> · Table '+esc(o.table_number||"—")+'<div class="muted">'+(o.items||[]).map(i=>esc(i.name)+" × "+i.quantity).join(", ")+' · '+o.total+' MAD</div></div><div><select data-order="'+o.id+'">'+["new","accepted","preparing","ready","served","paid","cancelled"].map(s=>'<option '+(s===o.status?"selected":"")+'>'+s+'</option>').join("")+'</select></div></div>').join("")||'<p class="muted">Aucune commande pour le moment.</p>';
$("cat").innerHTML='<option value="">Sans catégorie</option>'+(d.categories||[]).map(c=>'<option value="'+c.id+'">'+esc(c.name_fr||c.name_ar)+'</option>').join("");
$("plist").innerHTML=(d.products||[]).map(p=>'<div class="row"><div><b>'+esc(p.name_fr||p.name_ar)+'</b><div class="muted">'+p.price+' MAD · '+(p.is_available?"Disponible":"Indisponible")+'</div></div><button data-del="'+p.id+'">Supprimer</button></div>').join("");
$("clist").innerHTML=(d.categories||[]).map(c=>'<div class="row">'+esc(c.name_fr||c.name_ar)+'</div>').join("");
$("tlist").innerHTML=(d.tables||[]).map(t=>{const url=location.origin+"/?slug="+encodeURIComponent(slug)+"&table="+encodeURIComponent(t.public_token);return '<div class="row"><div><b>Table '+esc(t.table_number)+'</b><div class="muted">'+esc(url)+'</div></div><a target="_blank" href="https://quickchart.io/qr?size=220&text='+encodeURIComponent(url)+'">QR</a></div>'}).join("");
$("slist").innerHTML=(d.requests||[]).map(s=>'<div class="row"><div>'+esc(s.request_type)+' · Table '+esc(s.table_number)+' · '+esc(s.status)+'</div><button data-done="'+s.id+'">Terminer</button></div>').join("")||'<p class="muted">Aucune demande.</p>';
document.querySelectorAll("[data-order]").forEach(x=>x.onchange=async()=>{try{await api("/api/admin","PATCH",{action:"order",slug,id:x.dataset.order,status:x.value});await load()}catch(e){alert(e.message)}});
document.querySelectorAll("[data-del]").forEach(x=>x.onclick=async()=>{if(confirm("Supprimer ce produit ?")){try{await api("/api/admin","DELETE",{action:"product",slug,id:x.dataset.del});await load()}catch(e){alert(e.message)}}});
document.querySelectorAll("[data-done]").forEach(x=>x.onclick=async()=>{try{await api("/api/admin","PATCH",{action:"request",slug,id:x.dataset.done,status:"done"});await load()}catch(e){alert(e.message)}});
}
$("connect").onclick=async()=>{key=$("key").value;try{await load();$("login").classList.add("hidden");$("app").classList.remove("hidden")}catch(e){$("loginmsg").textContent=e.message}};
$("saveR").onclick=async()=>{try{const j=await api("/api/admin","POST",{action:"restaurant",name:$("rname").value,slug:$("slug").value,phone:$("phone").value,address:$("address").value});slug=j.restaurant.slug;$("rmsg").textContent="Restaurant créé";await load()}catch(e){$("rmsg").textContent=e.message}};
$("addCat").onclick=async()=>{try{await api("/api/admin","POST",{action:"category",slug,name_ar:$("cAr").value,name_fr:$("cFr").value});$("cAr").value=$("cFr").value="";await load()}catch(e){alert(e.message)}};
$("addProduct").onclick=async()=>{try{await api("/api/admin","POST",{action:"product",slug,name_ar:$("pAr").value,name_fr:$("pFr").value,price:$("price").value,image_url:$("image").value,category_id:$("cat").value||null});$("pAr").value=$("pFr").value=$("price").value=$("image").value="";await load()}catch(e){alert(e.message)}};
$("addTable").onclick=async()=>{try{await api("/api/admin","POST",{action:"table",slug,table_number:$("tableNo").value});$("tableNo").value="";await load()}catch(e){alert(e.message)}};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["orders","products","categories","tables","requests"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab))});
</script></body></html>
