<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>TapNova Menu</title><style>
:root{font-family:Inter,system-ui,Arial;color:#17212b;background:#f5f6f7}*{box-sizing:border-box}body{margin:0}.hero{background:#101820;color:white;padding:28px 18px 24px;border-radius:0 0 26px 26px;background-size:cover;background-position:center}.hero:before{content:"";position:absolute;inset:0;background:#101820a8;pointer-events:none}.hero{position:relative}.hero .wrap{position:relative;z-index:1}.restaurantLogo{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#fff;display:none;border:2px solid #d9a441}.wrap{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;letter-spacing:.12em;color:#d9a441}.lang,button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}.lang{background:#29343d;color:white}.hero h1{font-size:30px;margin:22px 0 5px}.muted{opacity:.72}.content{padding:20px 16px 120px}.cats{display:flex;gap:8px;overflow:auto;padding:8px 0 18px}.cat{white-space:nowrap;background:white;color:#24313c}.cat.active{background:#d9a441;color:#101820}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.item{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #14202b0b}.item img{width:100%;height:145px;object-fit:cover;background:#e8ebee}.item .pad{padding:14px}.item h3{margin:0 0 6px}.desc{font-size:13px;color:#64717b;min-height:18px}.price{font-weight:800;margin:12px 0;color:#9b6b13}.add{background:#101820;color:white;width:100%}.bar{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px 16px;box-shadow:0 -4px 20px #0001}.barin{max-width:850px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.gold{background:#d9a441;color:#101820}.empty{text-align:center;padding:50px 10px;color:#65717a}.servicebox{background:#fff;border-radius:18px;padding:16px;margin:4px 0 18px;box-shadow:0 4px 18px #14202b0b}.servicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.servicebtn{background:#f1f3f5;color:#17212b;text-align:center;min-height:58px}.servicefeedback{font-size:13px;margin-top:10px;color:#276749;min-height:18px}.cartline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;justify-content:center}.sheet{background:white;width:min(100%,650px);padding:22px;border-radius:24px 24px 0 0;max-height:85vh;overflow:auto}.field{width:100%;padding:13px;border:1px solid #dce1e5;border-radius:10px;margin:6px 0 12px;font:inherit}.close{float:right;background:#edf0f2}@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:24px}}
</style></head><body><header class="hero"><div class="wrap"><div class="top"><div style="display:flex;align-items:center;gap:10px"><img id="rlogo" class="restaurantLogo" alt="Logo"><div class="brand">TAPNOVA</div></div><button class="lang" id="lang">العربية</button></div><h1 id="rname">TapNova Menu</h1><div class="muted" id="rdesc">Scan · Choose · Order</div></div></header><main class="content wrap"><div id="state" class="empty">Chargement du menu…</div><section class="servicebox" id="servicebox"><h2 id="serviceTitle">خدمات الطاولة</h2><div class="servicegrid"><button class="servicebtn" data-service="waiter">🔔 طلب النادل</button><button class="servicebtn" data-service="water">💧 طلب الماء</button><button class="servicebtn" data-service="cutlery">🍴 أدوات الأكل</button><button class="servicebtn" data-service="clean_table">🧹 تنظيف الطاولة</button><button class="servicebtn" data-service="bill">🧾 طلب الفاتورة</button><button class="servicebtn" id="moreProduct">➕ طلب منتج آخر</button></div><p class="servicefeedback" id="serviceFeedback" aria-live="polite"></p></section><nav class="cats" id="cats"></nav><section class="grid" id="products"></section></main><div class="bar"><div class="barin"><div><b id="cartcount">0 article</b><div class="muted" id="carttotal">0 MAD</div></div><button class="gold" id="checkout">Voir le panier</button></div></div><div class="modal" id="modal"><div class="sheet"><button class="close" id="close">Fermer</button><h2 id="carttitle">Votre commande</h2><div id="cartitems"></div><label id="notelabel">Note (facultatif)</label><textarea id="note" class="field" rows="2"></textarea><button class="gold" id="send" style="width:100%">Envoyer la commande</button><p id="feedback" class="muted"></p></div></div>
<script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search), slug=params.get("slug")||location.pathname.split("/").filter(Boolean).pop()||"cafe-tapnova-demo", table=params.get("table")||"", cart=new Map();let data=null,lang="fr",category="all";
const money=n=>new Intl.NumberFormat("fr-MA",{style:"currency",currency:"MAD"}).format(Number(n)||0);
function name(o){return lang==="ar"?(o.name_ar||o.name_fr):(o.name_fr||o.name_ar)}
const serviceLabels={waiter:"طلب النادل",water:"طلب الماء",cutlery:"طلب أدوات الأكل",clean_table:"تنظيف الطاولة",bill:"طلب الفاتورة"};
async function requestService(type){if(!table){$("serviceFeedback").textContent=lang==="fr"?"Scannez le QR de votre table pour utiliser ce service.":"خاصك تسكاني QR ديال الطابلة باش تستعمل هاد الخدمة.";return}const buttons=[...document.querySelectorAll("[data-service]")];buttons.forEach(b=>b.disabled=true);$("serviceFeedback").textContent=lang==="fr"?"Envoi de la demande…":"كنصيفطو الطلب…";try{const r=await fetch("/api/service",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug,table,request_type:type})});const j=await r.json();if(!r.ok)throw Error(j.error||"Erreur");$("serviceFeedback").textContent=(lang==="fr"?"Demande envoyée : ":"توصل الفريق بالطلب: ")+(lang==="fr"?j.request.label:serviceLabels[type]);}catch(e){$("serviceFeedback").textContent=e.message}finally{buttons.forEach(b=>b.disabled=false)}}
function render(){if(!data)return;$("rname").textContent=data.restaurant.name;$("rdesc").textContent=data.restaurant.description||data.restaurant.address||"Scan · Choose · Order";if(data.restaurant.logo_url){$("rlogo").src=data.restaurant.logo_url;$("rlogo").style.display="block"}if(data.restaurant.cover_url){document.querySelector(".hero").style.backgroundImage="linear-gradient(#10182055,#101820aa),url("+JSON.stringify(data.restaurant.cover_url)+")"}$("lang").textContent=lang==="fr"?"العربية":"Français";$("cats").innerHTML='<button class="cat '+(category==="all"?"active":"")+'" data-cat="all">'+(lang==="fr"?"Tout":"الكل")+'</button>'+data.categories.map(c=>'<button class="cat '+(category===c.id?"active":"")+'" data-cat="'+c.id+'">'+name(c)+'</button>').join("");$("cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{category=b.dataset.cat==="all"?"all":b.dataset.cat;render()});const products=data.products.filter(p=>category==="all"||p.category_id===category);$("products").innerHTML=products.map(p=>'<article class="item">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':'<div style="height:145px;background:#e8ebee"></div>')+'<div class="pad"><h3>'+esc(name(p))+'</h3><div class="desc">'+esc(lang==="ar"?(p.description_ar||""):(p.description_fr||""))+'</div><div class="price">'+money(p.price)+'</div><button class="add" data-id="'+p.id+'">'+(lang==="fr"?"Ajouter +":"أضف +")+'</button></div></article>').join("")||'<div class="empty">Aucun produit pour le moment</div>';$("products").querySelectorAll(".add").forEach(b=>b.onclick=()=>{cart.set(b.dataset.id,(cart.get(b.dataset.id)||0)+1);cartUI()});cartUI();$("servicebox").style.display=table?"block":"none";$("serviceTitle").textContent=lang==="fr"?"Services à table":"خدمات الطاولة";document.querySelectorAll("[data-service]").forEach(b=>{const t=b.dataset.service;b.textContent=({waiter:"🔔 "+(lang==="fr"?"Appeler le serveur":"طلب النادل"),water:"💧 "+(lang==="fr"?"Demander de l’eau":"طلب الماء"),cutlery:"🍴 "+(lang==="fr"?"Demander des couverts":"أدوات الأكل"),clean_table:"🧹 "+(lang==="fr"?"Nettoyer la table":"تنظيف الطاولة"),bill:"🧾 "+(lang==="fr"?"Demander l’addition":"طلب الفاتورة")})[t]});$("moreProduct").textContent=lang==="fr"?"➕ Commander un autre produit":"➕ طلب منتج آخر";$("moreProduct").onclick=()=>{document.getElementById("cats").scrollIntoView({behavior:"smooth",block:"start"});$("serviceFeedback").textContent=lang==="fr"?"Choisissez un produit puis ajoutez-le au panier.":"اختار المنتج وزيدو للسلة."}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cartUI(){let count=0,total=0;for(const [id,q] of cart){const p=data?.products.find(x=>x.id===id);if(p){count+=q;total+=Number(p.price)*q}}$("cartcount").textContent=count+(lang==="fr"?" article(s)":" منتج");$("carttotal").textContent=money(total)}
$("lang").onclick=()=>{lang=lang==="fr"?"ar":"fr";document.documentElement.dir=lang==="ar"?"rtl":"ltr";render()};document.querySelectorAll("[data-service]").forEach(b=>b.addEventListener("click",()=>requestService(b.dataset.service)));
$("checkout").onclick=()=>{if(!cart.size)return alert(lang==="fr"?"Votre panier est vide":"السلة فارغة");$("cartitems").innerHTML=[...cart].map(([id,q])=>{const p=data.products.find(x=>x.id===id);return '<div class="cartline"><span>'+esc(name(p))+' × '+q+'</span><b>'+money(p.price*q)+'</b></div>'}).join("");$("modal").style.display="flex"};
$("close").onclick=()=>$("modal").style.display="none";
$("send").onclick=async()=>{const items=[...cart].map(([product_id,quantity])=>({product_id,quantity}));$("send").disabled=true;$("feedback").textContent=lang==="fr"?"Envoi…":"جاري الإرسال…";try{const r=await fetch("/api/menu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug,table,items,customer_note:$("note").value})});const j=await r.json();if(!r.ok)throw Error(j.error||"Erreur");cart.clear();cartUI();$("feedback").textContent=(lang==="fr"?"Commande envoyée. Numéro : ":"تم إرسال الطلب. رقم الطلب: ")+j.order.id;$("note").value=""}catch(e){$("feedback").textContent=e.message}finally{$("send").disabled=false}};
(async()=>{try{const r=await fetch("/api/menu?slug="+encodeURIComponent(slug));const j=await r.json();if(!r.ok)throw Error(j.error||"Menu indisponible");data=j;$("state").remove();render()}catch(e){$("state").textContent=e.message+" — Le restaurant doit encore configurer son menu."}})();
</script></body></html>
