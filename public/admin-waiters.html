<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapNova · تفعيل النادلين</title><style>body{font-family:system-ui;background:#f3f5f6;color:#17212b;margin:0}.wrap{max-width:650px;margin:28px auto;padding:16px}.card{background:#fff;border-radius:16px;padding:20px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:9px;width:100%;margin:7px 0}input{border:1px solid #ccd3d8}button{background:#101820;color:white;border:0;font-weight:bold}.gold{background:#d9a441;color:#101820}.muted{color:#667;font-size:13px}.device{border-top:1px solid #eee;padding:12px 0}.device button{width:auto;background:#a83232}.ok{color:#187447}a{overflow-wrap:anywhere}</style><main class="wrap"><h2>TapNova Talab · إدارة هواتف النادلين</h2><section class="card"><p>هاد الصفحة خاصة بك أنت فقط. كود الإدارة الرئيسي ما كيتعطاش لا لصاحب المقهى لا للنادل.</p><label>كود الإدارة الرئيسي</label><input id="key" type="password" autocomplete="off"><label>Slug ديال المقهى</label><input id="slug" placeholder="hamza-cafe" value="hamza-cafe"><button id="load">عرض أجهزة المقهى</button><button id="make" class="gold">إنشاء رابط تفعيل نادل جديد</button><p class="muted" id="status"></p><div id="result"></div></section><section class="card"><h3>هواتف النادلين المسجلة</h3><div id="devices" class="muted">دخل كود الإدارة واختار المقهى لعرض الأجهزة.</div></section><script>const $=id=>document.getElementById(id);let devices=[];async function call(url,method="GET",body){const r=await fetch(url,{method,headers:{"Content-Type":"application/json","x-admin-key":$("key").value.trim()},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||"تعذر إتمام العملية");return j}async function load(){const slug=$("slug").value.trim();const d=await call("/api/waiter-admin?slug="+encodeURIComponent(slug));devices=d.devices||[];$("devices").innerHTML=devices.map(x=>'<div class="device"><b>'+String(x.device_name).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</b><p class="muted">آخر اتصال: '+new Date(x.last_seen_at).toLocaleString("fr-MA")+' · '+(x.telegram_active?"Telegram مربوط ✓":(x.push_active?"Push مفعّل":"الإشعارات غير مفعّلة"))+' · '+(x.active?"نشط":"ملغى")+'</p>'+(x.active?'<button data-revoke="'+x.id+'">إلغاء تفعيل هذا الهاتف</button>':'')+'</div>').join("")||"مازال ما تسجل حتى هاتف.";document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{if(!confirm("واش متأكد تلغي تفعيل هاد الهاتف؟"))return;try{await call("/api/waiter-admin","PATCH",{action:"revoke",slug,id:b.dataset.revoke});await load()}catch(e){$("status").textContent=e.message}})}$("load").onclick=async()=>{try{await load();$("status").textContent="تم تحميل الأجهزة"}catch(e){$("status").textContent=e.message}};$("make").onclick=async()=>{try{const j=await call("/api/waiter-invite-admin","POST",{slug:$("slug").value.trim()});const url=location.origin+j.invite_url;$("result").innerHTML="";const a=document.createElement("a");a.href=url;a.textContent=url;a.target="_blank";const copy=document.createElement("button");copy.textContent="نسخ الرابط";copy.onclick=()=>navigator.clipboard.writeText(url).then(()=>copy.textContent="تم النسخ");$("result").append(a,copy);$("status").textContent="الرابط صالح 24 ساعة ويُستعمل مرة واحدة.";await load()}catch(e){$("status").textContent=e.message}};</script></main></html>
