<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapNova · تفعيل النادلين</title><style>body{font-family:system-ui;background:#f3f5f6;color:#17212b;margin:0}.wrap{max-width:560px;margin:28px auto;padding:16px}.card{background:#fff;border-radius:16px;padding:20px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:9px;width:100%;margin:7px 0}input{border:1px solid #ccd3d8}button{background:#101820;color:white;border:0;font-weight:bold}.gold{background:#d9a441;color:#101820}.muted{color:#667;font-size:13px}a{overflow-wrap:anywhere}</style><main class="wrap"><h2>TapNova Talab · إدارة أجهزة النادلين</h2><section class="card"><p>هاد الصفحة مخصصة ليك أنت فقط. استعمل كود الإدارة الرئيسي لإنشاء رابط تفعيل خاص بهاتف النادل.</p><label>كود الإدارة الرئيسي</label><input id="key" type="password" autocomplete="off"><label>Slug ديال المقهى</label><input id="slug" placeholder="hamza-cafe" value="hamza-cafe"><button id="make" class="gold">إنشاء رابط تفعيل</button><p class="muted" id="status"></p><div id="result"></div></section><script>const $=id=>document.getElementById(id);$("make").onclick=async()=>{const key=$("key").value.trim(),slug=$("slug").value.trim();$("result").textContent="";$("status").textContent="كننشئو الرابط…";try{const r=await fetch("/api/waiter-invite-admin",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key},body:JSON.stringify({slug})});const j=await r.json();if(!r.ok)throw Error(j.error||"تعذر إنشاء الرابط");const url=location.origin+j.invite_url;$("status").textContent="الرابط صالح لمدة 24 ساعة ويُستعمل مرة واحدة.";const a=document.createElement("a");a.href=url;a.textContent=url;a.target="_blank";const copy=document.createElement("button");copy.textContent="نسخ الرابط";copy.onclick=()=>navigator.clipboard.writeText(url).then(()=>copy.textContent="تم النسخ");$("result").append(a,copy)}catch(e){$("status").textContent=e.message}};</script></main></html>
