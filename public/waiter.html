<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>TapNova · النادل</title><style>body{font-family:system-ui;background:#f3f5f6;margin:0;color:#17212b}.wrap{max-width:760px;margin:auto;padding:14px}.card,.ticket{background:white;border-radius:14px;padding:15px;margin:12px 0}.head{background:#101820;color:white;padding:18px}.muted{color:#667;font-size:13px}button{padding:10px 13px;border:0;border-radius:9px;background:#101820;color:white;font:inherit;margin:4px}.gold{background:#d9a441;color:#101820}.ticket{border-right:5px solid #d9a441}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hide{display:none}.tabs button.active{background:#d9a441;color:#101820}</style><header class="head"><div class="wrap"><b style="color:#d9a441">TAPNOVA TALAB</b><h2>واجهة النادل</h2><span class="muted" style="color:#ccd">الطلبات وإشعارات الطاولات</span></div></header><main class="wrap"><section id="activation" class="card"><h3>تفعيل هاتف النادل</h3><p>هذا الهاتف يتسجل في المقهى المرتبط برابط الدعوة فقط. ما كاين لا كود إدارة لا كود مقهى.</p><label>اسم النادل أو تعريف الهاتف</label><input id="deviceName" placeholder="مثال: النادل أحمد - هاتف 1"><button class="gold" id="activate">تفعيل هذا الهاتف</button><p id="msg" class="muted"></p></section><section id="dashboard" class="hide"><div class="card row"><b id="restaurant"></b><button id="telegram" class="gold">ربط Telegram واستقبال الإشعارات</button><button id="push">تفعيل Push (اختياري)</button></div><div class="tabs"><button class="active" data-tab="requests">نداءات الطاولات</button><button data-tab="orders">الطلبيات</button></div><div id="requests"></div><div id="orders" class="hide"></div></section></main><script>const $=x=>document.getElementById(x);const params=new URLSearchParams(location.search);let token=localStorage.getItem("tn_waiter_token"),invite=params.get("invite"),slug="",first=true,seen=new Set();async function req(url,method="GET",body){const r=await fetch(url,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||"خطأ");return j}function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}async function activate(){try{if(!invite)throw Error("رابط التفعيل غير موجود. طلب رابط جديد من صاحب المقهى.");const x=await req("/api/waiter-activate","POST",{invite,device_name:($("deviceName").value.trim()||"Waiter phone").slice(0,80)});token=x.token;localStorage.setItem("tn_waiter_token",token);history.replaceState({},"",location.pathname);await boot()}catch(e){$("msg").textContent=e.message}}async function boot(){try{const d=await req("/api/waiter-device");slug=d.restaurant.slug;$("restaurant").textContent=d.restaurant.name;$("activation").classList.add("hide");$("dashboard").classList.remove("hide");render(d);setInterval(refresh,5000)}catch(e){$("msg").textContent=e.message;localStorage.removeItem("tn_waiter_token");token=null}}async function refresh(){try{render(await req("/api/waiter-device"))}catch(e){$("msg").textContent=e.message}}function render(d){$("restaurant").textContent=d.restaurant.name;const all=[...(d.requests||[]).map(x=>({kind:"request",id:x.id,title:x.request_label,table:x.table_number,status:x.status,created:x.created_at})),...(d.orders||[]).map(x=>({kind:"order",id:x.id,title:"طلبية #"+x.id,table:x.table_number,status:x.status,created:x.created_at,items:x.items,total:x.total}))];if(!first&&all.some(x=>!seen.has(x.kind+x.id)))try{navigator.vibrate?.([200,100,200])}catch{}all.forEach(x=>seen.add(x.kind+x.id));$("requests").innerHTML=(d.requests||[]).map(x=>'<article class="ticket"><b>'+esc(x.request_label)+'</b><p>الطابلة '+esc(x.table_number)+' · '+esc(x.status)+'</p><button onclick="act(\'request\',\''+x.id+'\',\'acknowledged\')">نتكلف به</button><button onclick="act(\'request\',\''+x.id+'\',\'completed\')">تم</button></article>').join("")||'<div class="card">لا توجد نداءات جديدة</div>';$("orders").innerHTML=(d.orders||[]).map(x=>'<article class="ticket"><b>طلبية #'+esc(x.id)+'</b><p>طابلة '+esc(x.table_number)+' · '+esc(x.status)+'</p><p>'+((x.items||[]).map(i=>esc(i.name)+' × '+i.quantity).join('، '))+'</p><b>'+esc(x.total)+' MAD</b><div class="row"><button onclick="act(\'order\',\''+x.id+'\',\'preparing\')">تحضير</button><button onclick="act(\'order\',\''+x.id+'\',\'ready\')">وجدات</button><button onclick="act(\'order\',\''+x.id+'\',\'delivered\')">تسلمات</button></div></article>').join("")||'<div class="card">لا توجد طلبيات جديدة</div>';first=false}window.act=async(kind,id,status)=>{await req("/api/waiter-device","PATCH",{kind,id,status});await refresh()};$("activate").onclick=activate;$("telegram").onclick=async()=>{try{const j=await req("/api/telegram-link","POST",{});$("msg").textContent="غادي يتحل Telegram. اضغط Start باش تكمل الربط.";location.href=j.telegram_url}catch(e){$("msg").textContent=e.message}};$("push").onclick=async()=>{try{if(!("serviceWorker"in navigator)||!("PushManager"in window))throw Error("هاد المتصفح لا يدعم إشعارات Push");const permission=await Notification.requestPermission();if(permission!=="granted")throw Error("خاصك تسمح بالإشعارات من إعدادات الهاتف");const reg=await navigator.serviceWorker.register("/sw.js");const {publicKey}=await req("/api/push");const b64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0));const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(publicKey)});await req("/api/push","POST",{subscription:sub.toJSON()});$("push").textContent="الإشعارات مفعّلة ✓"}catch(e){alert(e.message)}};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));$("requests").classList.toggle("hide",b.dataset.tab!=="requests");$("orders").classList.toggle("hide",b.dataset.tab!=="orders")});if(token)boot();else if(invite)$("msg").textContent="اضغط تفعيل هذا الهاتف";</script></html>
